workflows:
  ios-sin-firma:
    name: iOS sin firma (para Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependencias de Flutter
        script: flutter pub get
      - name: Compilar iOS sin firma
        script: flutter build ios --release --no-codesign
      - name: Empaquetar el .ipa
        script: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr cuponapp.ipa Payload
    artifacts:
      - cuponapp.ipa